services:
  portfolio:
    build: .
    mem_limit: 128m
    cpus: 1
    pids_limit: 50
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8181/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - reverse-proxy
    # No ports published: portfolio isn't reachable directly, only
    # through the host's existing reverse-proxy container, which
    # joins the same external network and reaches it at
    # portfolio:8181.

networks:
  reverse-proxy:
    external: true
    # Name of the Docker network the host's existing reverse-proxy
    # container is attached to. Confirm with:
    #   docker network ls
    #   docker inspect <proxy-container> --format '{{json .NetworkSettings.Networks}}'
