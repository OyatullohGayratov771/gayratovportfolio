worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # Don't leak nginx version to clients/scanners.
  server_tokens off;

  # Static site never needs a body; caps request-smuggling / DoS surface.
  client_max_body_size 1k;

  # Modest per-IP request cap; the reverse proxy in front may already
  # rate-limit, but this is cheap insurance if it's ever hit directly.
  limit_req_zone $binary_remote_addr zone=portfolio:10m rate=10r/s;

  server {
    listen 8181;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=portfolio burst=20 nodelay;

    # Every asset here is static and public; a strict CSP costs nothing
    # since the site has no inline scripts/styles. The only other origin is
    # Cloudflare Web Analytics, whose beacon Cloudflare injects into every page.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Block dotfiles (.git, .env, etc.) even though none are shipped in the image.
    location ~ /\. {
      deny all;
    }

    location = /healthz {
      access_log off;
      return 200;
    }

    # Clean URLs: /about resolves to about.html, / resolves to index.html.
    location / {
      try_files $uri $uri.html $uri/ =404;
      limit_except GET HEAD {
        deny all;
      }
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
